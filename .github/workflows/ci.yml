name: Node CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_onebot_inbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_onebot_inbox_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_onebot_inbox_test
      NOTIFICATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_onebot_inbox_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE aoi_app NOLOGIN"
      - run: npm run migrate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
